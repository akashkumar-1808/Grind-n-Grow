<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Grind ‘n Grow</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <div class="logo">Grind ‘n Grow</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html" class="btn-nav">Login</a></li>
    </ul>
  </nav>

  <div class="login-container">
    <div class="login-card">
      <h1>Welcome Back </h1>
      <p class="subtitle">Log in to continue your growth journey</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Login</button>
        <p class="signup-text">Don’t have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
