<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Grind ‘n Grow</title>
  <link rel="stylesheet" href="signup.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav>
    <div class="logo">Grind ‘n Grow</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html" class="btn-nav">Login</a></li>
    </ul>
  </nav>

  <div class="signup-container">
    <div class="signup-card">
      <h1>Create Your Account</h1>
      <p class="subtitle">Join and start your growth journey today!</p>

      <form id="signupForm">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="btn-signup">Sign Up</button>
        <p class="login-text">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
